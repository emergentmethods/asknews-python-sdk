version: "3"

silent: true

vars:
  PACKAGE_SRC_DIR: asknews_sdk

tasks:
  # Unit tests
  test:
    cmds:
      - coverage run -m pytest --junitxml=report.xml {{.CLI_ARGS}}
      - coverage report
      - coverage xml
      - coverage html -d coverage-report

  # Lint
  lint:
    vars:
      LINT_DIR: '{{.SRC_DIR | default .PACKAGE_SRC_DIR}}'
    cmds:
      - uvx ruff check {{.LINT_DIR}} {{.CLI_ARGS}}
      - |
        if [ "{{.FORMAT}}" = "true" ]; then
          uvx ruff format {{.LINT_DIR}} {{.CLI_ARGS}}
        fi

  # Build
  build:
    cmds:
      - uv build --wheel
